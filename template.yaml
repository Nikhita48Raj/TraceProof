AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: TraceProof synthetic deletion verification research prototype

Parameters:
  FrontendOrigin:
    Type: String
    Default: http://localhost:5173
    Description: Exact browser origin allowed to call the API (scheme and host, no path).
  MaxReceiveCount:
    Type: Number
    Default: 3
    MinValue: 2
    MaxValue: 5
    Description: Failed receives before SQS moves a job to the dead-letter queue.

Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 256
    Architectures:
      - arm64
    Environment:
      Variables:
        RESOURCE_TABLE_NAME: !Ref ResourceTable
        REQUEST_TABLE_NAME: !Ref RequestTable
        EXPERIMENT_TABLE_NAME: !Ref ExperimentTable
        REPORT_BUCKET: !Ref ReportBucket
        FRONTEND_ORIGIN: !Ref FrontendOrigin

Resources:
  # ── API Gateway HTTP API ────────────────────────────────────────────────────
  # Service 1: Amazon API Gateway HTTP API
  # Receives all browser requests, enforces CORS, routes to the ApiFunction Lambda.
  TraceProofHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      CorsConfiguration:
        AllowOrigins:
          - !Ref FrontendOrigin
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - Content-Type

  # ── DynamoDB Tables ─────────────────────────────────────────────────────────
  # Service 2: Amazon DynamoDB (three on-demand tables)
  ResourceTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: resource_id
          AttributeType: S
      KeySchema:
        - AttributeName: resource_id
          KeyType: HASH

  RequestTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: request_id
          AttributeType: S
      KeySchema:
        - AttributeName: request_id
          KeyType: HASH

  # Stores experiment run summaries (config, metrics, scenarios) so results
  # survive Lambda cold starts and are available for CSV/Markdown export.
  ExperimentTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: experiment_id
          AttributeType: S
      KeySchema:
        - AttributeName: experiment_id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # ── SQS Queues ──────────────────────────────────────────────────────────────
  # Service 3: Amazon SQS – deletion job queue and dead-letter queue
  DeletionDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  DeletionQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 300
      MessageRetentionPeriod: 345600
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt DeletionDeadLetterQueue.Arn
        maxReceiveCount: !Ref MaxReceiveCount

  # ── S3 Bucket ───────────────────────────────────────────────────────────────
  # Service 4: Amazon S3 – private encrypted bucket for verification and
  # experiment reports.  Reports expire after 90 days via lifecycle rule.
  ReportBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ExpireSyntheticReports
            Status: Enabled
            ExpirationInDays: 90

  # ── Lambda Functions ─────────────────────────────────────────────────────────
  # Service 5: AWS Lambda – ApiFunction handles all API Gateway HTTP routes;
  # WorkerFunction processes deletion jobs triggered by SQS messages.
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: aws_handlers.api.lambda_handler
      Timeout: 15
      Environment:
        Variables:
          DELETION_QUEUE_URL: !Ref DeletionQueue
      Policies:
        - Version: '2012-10-17'
          Statement:
            # ResourceTable: seed + list resources + dependency lookup
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:Scan
              Resource: !GetAtt ResourceTable.Arn
            # RequestTable: create, read, list, and update deletion requests
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:Scan
                - dynamodb:UpdateItem
              Resource: !GetAtt RequestTable.Arn
            # ExperimentTable: write experiment results and read them for export
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
              Resource: !GetAtt ExperimentTable.Arn
            # DeletionQueue: enqueue deletion jobs
            - Effect: Allow
              Action:
                - sqs:SendMessage
              Resource: !GetAtt DeletionQueue.Arn
            # ReportBucket: presigned-URL redirect for deletion reports
            # and read experiment report objects for CSV/Markdown export
            - Effect: Allow
              Action:
                - s3:GetObject
              Resource: !Sub '${ReportBucket.Arn}/reports/*'
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              Resource: !Sub '${ReportBucket.Arn}/experiments/*'
      Events:
        Root:
          Type: HttpApi
          Properties:
            ApiId: !Ref TraceProofHttpApi
            Path: /
            Method: GET
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref TraceProofHttpApi
            Path: /health
            Method: GET
        ResourcesList:
          Type: HttpApi
          Properties:
            ApiId: !Ref TraceProofHttpApi
            Path: /resources
            Method: GET
        Dependencies:
          Type: HttpApi
          Properties:
            ApiId: !Ref TraceProofHttpApi
            Path: /resources/{resource_id}/dependencies
            Method: GET
        DeletionCreate:
          Type: HttpApi
          Properties:
            ApiId: !Ref TraceProofHttpApi
            Path: /deletion-requests
            Method: POST
        DeletionList:
          Type: HttpApi
          Properties:
            ApiId: !Ref TraceProofHttpApi
            Path: /deletion-requests
            Method: GET
        DeletionRead:
          Type: HttpApi
          Properties:
            ApiId: !Ref TraceProofHttpApi
            Path: /deletion-requests/{request_id}
            Method: GET
        ReportRead:
          Type: HttpApi
          Properties:
            ApiId: !Ref TraceProofHttpApi
            Path: /deletion-requests/{request_id}/report
            Method: GET
        ExperimentCompare:
          Type: HttpApi
          Properties:
            ApiId: !Ref TraceProofHttpApi
            Path: /experiments/compare
            Method: GET
        ExperimentRun:
          Type: HttpApi
          Properties:
            ApiId: !Ref TraceProofHttpApi
            Path: /experiments/run
            Method: POST
        # Experiment export routes – results are persisted in DynamoDB and S3
        # so these endpoints work across Lambda invocations and cold starts.
        ExperimentTrialsCsv:
          Type: HttpApi
          Properties:
            ApiId: !Ref TraceProofHttpApi
            Path: /experiments/{experiment_id}/trials.csv
            Method: GET
        ExperimentAggregatesCsv:
          Type: HttpApi
          Properties:
            ApiId: !Ref TraceProofHttpApi
            Path: /experiments/{experiment_id}/aggregates.csv
            Method: GET
        ExperimentReportMd:
          Type: HttpApi
          Properties:
            ApiId: !Ref TraceProofHttpApi
            Path: /experiments/{experiment_id}/report.md
            Method: GET

  WorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: aws_handlers.worker.lambda_handler
      Timeout: 45
      Environment:
        Variables:
          MAX_RECEIVE_COUNT: !Ref MaxReceiveCount
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:Scan
              Resource: !GetAtt ResourceTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource: !GetAtt RequestTable.Arn
            # Worker writes verification reports to the private S3 bucket.
            - Effect: Allow
              Action:
                - s3:PutObject
              Resource: !Sub '${ReportBucket.Arn}/reports/*'
      Events:
        DeletionJobs:
          Type: SQS
          Properties:
            Queue: !GetAtt DeletionQueue.Arn
            BatchSize: 1
            MaximumBatchingWindowInSeconds: 0
            ScalingConfig:
              MaximumConcurrency: 2
            FunctionResponseTypes:
              - ReportBatchItemFailures

  # ── CloudWatch Log Groups ────────────────────────────────────────────────────
  # Explicit log groups give 14-day retention and predictable names.
  ApiFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ApiFunction}'
      RetentionInDays: 14

  WorkerFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${WorkerFunction}'
      RetentionInDays: 14

Outputs:
  ApiBaseUrl:
    Description: API Gateway HTTP API base URL
    Value: !Sub 'https://${TraceProofHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}'
  ResourceTableName:
    Value: !Ref ResourceTable
  RequestTableName:
    Value: !Ref RequestTable
  ExperimentTableName:
    Value: !Ref ExperimentTable
  DeletionQueueUrl:
    Value: !Ref DeletionQueue
  DeletionDeadLetterQueueUrl:
    Value: !Ref DeletionDeadLetterQueue
  ReportBucketName:
    Value: !Ref ReportBucket
